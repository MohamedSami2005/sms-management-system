<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 text-muted fs-6">College SMS Management System</span>
        
        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2 border" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5 text-primary"></i>
                        <span>{{ user.username }}</span>
                        <span class="badge bg-secondary ms-1">{{ user.get_role_display }}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><span class="dropdown-header">Department: {{ user.department.name|default:"General" }}</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form method="post" action="{% url 'accounts:logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item text-danger d-flex align-items-center gap-2">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-sm">Login</a>
            {% endif %}
        </div>
    </div>
</nav>
