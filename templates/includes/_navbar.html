<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <div class="navbar-title">
            <i class="bi bi-building-gear text-primary"></i>
            <span>Campus Communication Management System (CCMS)</span>
        </div>
        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <div class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2 px-3" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="border-radius: 9999px;">
                        <i class="bi bi-person-circle text-primary"></i>
                        <span>{{ user.get_full_name|default:user.username }}</span>
                        <span class="badge bg-primary-soft text-primary">{{ user.get_role_display }}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end mt-2">
                        <li><span class="dropdown-header"><i class="bi bi-building me-1"></i> {{ user.department.name|default:"General Campus" }}</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item" href="{% url 'accounts:profile' %}">
                                <i class="bi bi-person-vcard opacity-75"></i> My Profile
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="{% url 'accounts:password_change' %}">
                                <i class="bi bi-shield-lock opacity-75"></i> Change Password
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form method="post" action="{% url 'accounts:logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right"></i> Sign Out
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-sm px-3 fw-bold">Sign In</a>
            {% endif %}
        </div>
    </div>
</nav>
