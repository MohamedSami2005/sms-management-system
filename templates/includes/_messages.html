{% if messages %}
    <div class="messages-container mb-4">
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show shadow-sm border-0 alert-dismissible-auto d-flex align-items-center gap-2" role="alert">
                {% if message.tags == 'success' %}
                    <i class="bi bi-check-circle-fill fs-5 me-1"></i>
                {% elif message.tags == 'error' or message.tags == 'danger' %}
                    <i class="bi bi-x-circle-fill fs-5 me-1"></i>
                {% elif message.tags == 'warning' %}
                    <i class="bi bi-exclamation-triangle-fill fs-5 me-1"></i>
                {% else %}
                    <i class="bi bi-info-circle-fill fs-5 me-1"></i>
                {% endif %}
                <div>{{ message }}</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const alerts = document.querySelectorAll('.alert-dismissible-auto');
                alerts.forEach(function(alert) {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                });
            }, 6000);
        });
    </script>
{% endif %}
