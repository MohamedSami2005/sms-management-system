{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-wrapper" style="margin: -2.5rem -3rem; min-height: calc(100vh - var(--navbar-height, 0px));">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="bi bi-key"></i>
            </div>
            <h3 class="fw-bold mb-1">Forgot Password?</h3>
            <p class="text-white-50 small mb-0 fw-medium">Enter your email to receive reset instructions</p>
        </div>
        <div class="auth-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="{{ form.email.id_for_label }}" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-muted border-end-0">
                            <i class="bi bi-envelope"></i>
                        </span>
                        {{ form.email }}
                    </div>
                    {% if form.email.errors %}
                        <div class="text-danger small mt-1">{{ form.email.errors }}</div>
                    {% endif %}
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">
                        Send Reset Link <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer bg-slate-50 text-center py-3 border-top-0">
            <a href="{% url 'accounts:login' %}" class="text-decoration-none text-secondary small fw-medium">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
            </a>
        </div>
    </div>
</div>

<style>
/* Fix borders for input group */
.auth-body .input-group .form-control {
    border-left: 0;
}
.auth-body .input-group-text {
    border-color: var(--border-color);
}
.auth-body .input-group:focus-within .input-group-text,
.auth-body .input-group:focus-within .form-control {
    border-color: var(--primary);
}
.auth-body .input-group:focus-within .input-group-text {
    color: var(--primary) !important;
}
</style>
{% endblock %}
