{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="auth-wrapper" style="margin: -2.5rem -3rem; min-height: calc(100vh - var(--navbar-height, 0px));">
    <div class="auth-card text-center p-5">
        <div class="mb-4">
            <i class="bi bi-shield-check display-2 text-success"></i>
        </div>
        <h3 class="fw-bold mb-3 text-dark">Password Reset Successful!</h3>
        <p class="text-muted mb-4" style="font-size: 1.05rem;">
            Your account password has been updated successfully. You can now log in with your new credentials.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg fw-bold px-5">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
