{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 mt-4 mb-5">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center p-4">
            <i class="bi bi-shield-check display-3 text-success mb-3"></i>
            <h4 class="fw-bold mb-2">Password Reset Successful!</h4>
            <p class="text-muted small">Your account password has been updated successfully. You can now log in with your new credentials.</p>
            <div class="mt-3">
                <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-3 w-100 fw-bold">
                    Sign In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
