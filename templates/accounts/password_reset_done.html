{% extends 'base.html' %}

{% block title %}Reset Link Sent{% endblock %}

{% block content %}
<div class="auth-wrapper" style="margin: -2.5rem -3rem; min-height: calc(100vh - var(--navbar-height, 0px));">
    <div class="auth-card text-center p-5">
        <div class="mb-4">
            <i class="bi bi-check-circle-fill display-2 text-success"></i>
        </div>
        <h3 class="fw-bold mb-3 text-dark">Check Your Inbox</h3>
        <p class="text-muted mb-4" style="font-size: 1.05rem;">
            We've sent password reset instructions to your email address. If you don't receive an email within a few minutes, check your spam folder.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg fw-bold px-5">
            Return to Login
        </a>
    </div>
</div>
{% endblock %}
