{% extends 'base.html' %}

{% block title %}Reset Link Sent{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 mt-4 mb-5">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center p-4">
            <i class="bi bi-check-circle-fill display-3 text-success mb-3"></i>
            <h4 class="fw-bold mb-2">Check Your Inbox</h4>
            <p class="text-muted small">
                We've sent password reset instructions to your email address. If you don't receive an email within a few minutes, check your spam folder.
            </p>
            <div class="mt-3">
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary rounded-3 w-100">
                    Return to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
