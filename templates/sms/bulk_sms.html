{% extends 'base.html' %}

{% block title %}Send Bulk SMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header">
                <h5 class="card-title"><i class="bi bi-file-earmark-spreadsheet text-primary me-2"></i>Bulk SMS Dispatch</h5>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Upload CSV or Excel file containing phone numbers and dynamic parameters.</p>
                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-1"></i> File parser and batch dispatch engine.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
