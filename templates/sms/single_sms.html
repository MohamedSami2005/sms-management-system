{% extends 'base.html' %}

{% block title %}Send Single SMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white py-3 border-0">
                <h4 class="fw-bold mb-0"><i class="bi bi-send text-primary me-2"></i>Send Single SMS</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Select a registered DLT Template and fill in variable parameters.</p>
                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-1"></i> SMS Gateway Dispatch logic will be wired in the next module step.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
